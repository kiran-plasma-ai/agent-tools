# Dedicated kitty instance for the omp debug channel — the ONLY kitty with
# remote control enabled. install.sh substitutes @HOME@ with your home.
# Remote control is gated: empty shared secret, every command must pass
# auth.py (background launch of omp-debug-dispatch with a registered env
# and a [a-z0-9-] key — nothing else).
allow_remote_control password
remote_control_password "" "@HOME@/.config/kitty-debug/auth.py"
background #241a1a
